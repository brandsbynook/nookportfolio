<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nook Studio &amp; Co. — Independent Digital Product Builder &amp; Interface Designer</title>
    <meta name="description" content="Designing and deploying fast, minimalist business websites and mobile applications." />
    <meta property="og:title" content="Nook Studio &amp; Co. — Independent Digital Product Builder &amp; Interface Designer" />

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
      
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px; /* Offset for fixed navbar */
      }

      html, body, #root {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #090b0e;
        color: #e6e2da;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      
      .font-serif {
        font-family: 'Playfair Display', serif;
      }

      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Hide scrollbar for clean aesthetic in horizontal scrolls if any */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes marquee {
        0% { transform: translateX(0%); }
        100% { transform: translateX(-50%); }
      }

      .animate-marquee {
        display: flex;
        width: 200%;
        animation: marquee 35s linear infinite;
      }

      .animate-marquee:hover {
        animation-play-state: paused;
      }

      @keyframes editorial-fade-in {
        0% {
          opacity: 0;
          transform: translateY(16px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-editorial-fade {
        animation: editorial-fade-in 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-editorial-slow {
        animation: editorial-fade-in 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-fade-in-up {
        animation: editorial-fade-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      .animate-delay-100 { animation-delay: 0.1s; }
      .animate-delay-200 { animation-delay: 0.2s; }
      .animate-delay-350 { animation-delay: 0.35s; }
      .animate-delay-500 { animation-delay: 0.5s; }
      .animate-delay-650 { animation-delay: 0.65s; }

      @media (prefers-reduced-motion: reduce) {
        .animate-editorial-fade,
        .animate-editorial-slow,
        .animate-fade-in-up {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
